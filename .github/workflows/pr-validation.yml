name: Validate pull requests

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Compile, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the pull request
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run build:compile

      - name: Run unit tests
        run: npm test

      - name: Build deployable artifacts
        run: npm run build

      - name: Verify flat-layout deployment mirrors
        shell: bash
        run: |
          test -s main.js
          test -s styles.css
          test -s dist/build/main.js
          test -s dist/build/styles.css
          cmp main.js dist/build/main.js
          cmp styles.css dist/build/styles.css
